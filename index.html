function tr(k){return (I18N[currentLanguage]||I18N.ar)[k]||I18N.ar[k]||k}
function formatDate(d){if(!d)return "-";return new Date(d+"T00:00:00").toLocaleDateString(currentLanguage==="ar"?"ar-DZ":currentLanguage==="fr"?"fr-FR":"en-GB")}
function equipmentLabel(t){return ({shoes:{ar:"حذاء حماية",fr:"Chaussures de sécurité",en:"Safety shoes"},bleu:{ar:"ملابس العمل",fr:"Bleu de travail",en:"Work clothes"},glasses:{ar:"نظارات حماية",fr:"Lunettes de sécurité",en:"Safety glasses"},gants:{ar:"قفازات",fr:"Gants",en:"Gloves"},vest_soudeur:{ar:"سترة لحام",fr:"Gilet soudeur",en:"Welding vest"}}[t]||{})[currentLanguage]||t}
function statusText(s){return s==="due"?tr("due"):s==="soon"?tr("soon"):s==="notdue"?tr("notDue"):tr("notIssued")}
function remainingText(date){if(!date)return tr("notIssued");const diff=dueDiffDays(date);if(diff<=0)return diff===0?tr("today"):`${tr("overdue")} ${Math.abs(diff)} ${Math.abs(diff)===1?tr("day"):tr("days")}`;const a=new Date(todayKey()+"T00:00:00"),b=new Date(date+"T00:00:00");let months=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());let anchor=new Date(a);anchor.setMonth(anchor.getMonth()+months);if(anchor>b){months--;anchor=new Date(a);anchor.setMonth(anchor.getMonth()+months)}const days=Math.floor((b-anchor)/86400000);let parts=[];if(months===1)parts.push(`1 ${tr("month")}`);else if(months>1)parts.push(`${months} ${tr("months")}`);if(days>0)parts.push(`${days} ${days===1?tr("day"):tr("days")}`);return `${tr("remaining")} ${parts.join(currentLanguage==="ar"?" و ":" ")}`}
function translateApp(){
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    const k=el.dataset.i18n;
    if(I18N[currentLanguage] && I18N[currentLanguage][k]!==undefined) el.textContent=tr(k);
  });
  const mp={stockSearch:"searchProduct",workerSearch:"searchWorker",equipmentSearch:"searchEquipment",dueSearch:"searchDue",userSearch:"searchUser"};
  Object.entries(mp).forEach(function(pair){
    const id=pair[0], k=pair[1], el=document.getElementById(id);
    if(el) el.placeholder=tr(k);
  });
  const mt=document.getElementById("movementTitle");
  if(mt) mt.textContent=movementType==="entry" ? "📥 "+tr("entryStock") : "📤 "+tr("exitStock");
  const d=document.getElementById("developerLabel");
  if(d) d.textContent=tr("developer");
  const ld=document.getElementById("loginDeveloperLabel");
  if(ld) ld.textContent=tr("developer");
  const te=document.getElementById("topUserEmail");
  if(te && currentUser) te.textContent=currentUser.email||"";
}
function changeLanguage(lang){currentLanguage=lang;localStorage.setItem("stockpro_language",lang);document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";const ls=document.getElementById("languageSelect");if(ls)ls.value=lang;translateApp();renderProducts();renderWorkers();renderEquipment();renderDue();if(isMasterAdmin())renderUsers();updateInstallButton();}
function isAppInstalled(){return window.matchMedia("(display-mode: standalone)").matches||window.matchMedia("(display-mode: fullscreen)").matches||window.matchMedia("(display-mode: minimal-ui)").matches||window.navigator.standalone===true;}
function updateInstallButton(){const installed=isAppInstalled();const home=document.getElementById("homeInstallBox");const login=document.getElementById("loginInstallButton");const settings=document.getElementById("installButton");const show=!installed&&!!deferredPrompt;if(home)home.style.display=show?"block":"none";if(login)login.style.display=show?"block":"none";if(settings)settings.style.display="none";}

async function checkSession(){const {data,error}=await db.auth.getSession();if(error){showLogin();return}if(data.session){if(await applyUser(data.session.user))await loadAll()}else showLogin()}
async function login(e){if(e)e.preventDefault();const email=document.getElementById("loginEmail").value.trim(),password=document.getElementById("loginPassword").value,btn=document.getElementById("loginBtn");document.getElementById("loginError").style.display="none";if(!email||!password){showLoginError("أدخل البريد الإلكتروني وكلمة السر.");return}btn.disabled=true;btn.textContent="جاري الدخول...";const {data,error}=await db.auth.signInWithPassword({email,password});btn.disabled=false;btn.textContent="دخول إلى التطبيق";if(error){console.error(error);showLoginError("فشل تسجيل الدخول. تأكد من Email وكلمة السر.");return}if(!(await applyUser(data.user)))return;await loadAll();toast("تم تسجيل الدخول ✅")}
async function logout(){if(!confirm("هل تريد تسجيل الخروج؟"))return;await db.auth.signOut();currentUser=null;isAdmin=false;products=[];workers=[];equipment=[];movements=[];showLogin()}
db.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT"){currentUser=null;isAdmin=false;showLogin()}else if(event==="SIGNED_IN"&&session){setTimeout(async()=>{if(await applyUser(session.user))await loadAll()},0)}});
function showPage(id,btn){if(id==="admin"&&!isAdmin){toast("هذه الصفحة للأدمن فقط ❌");return;}document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));const p=document.getElementById(id);if(p)p.classList.add("active");document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));if(btn)btn.classList.add("active")}
function activatePage(id){const b=[...document.querySelectorAll(".nav button")].find(x=>x.getAttribute("onclick")?.includes("'"+id+"'"));showPage(id,b)}
function closeModal(id){document.getElementById(id).classList.remove("show")}
async function loadAll(){await Promise.all([loadProducts(),loadWorkers(),loadEquipment(),loadMovements()]);statistics();renderDue();renderEquipment();renderHomeProducts()}
async function loadProducts(){const {data,error}=await db.from("products").select("*").eq("user_id",currentUser.id).order("name");if(error){toast("خطأ في تحميل المنتجات ❌");console.error(error);return}products=data||[];renderProducts()}
function renderProducts(){const box=document.getElementById("products"),q=(document.getElementById("stockSearch")?.value||"").toLowerCase().trim();box.innerHTML="";products.filter(p=>(p.name||"").toLowerCase().includes(q)||(p.reference||"").toLowerCase().includes(q)).forEach(p=>{const div=document.createElement("div");div.className="product";const low=Number(p.quantity||0)<=5;div.innerHTML=`<div class="product-main"><div class="product-info"><div class="product-icon">📦</div><div><div class="product-name">${safe(p.name)}</div><div class="product-ref">${safe(p.reference)} · ${safe(p.family||"غير مصنف")}</div></div></div><div class="quantity ${low?"low":"good"}">${Number(p.quantity||0)}<small>الكمية</small></div></div><div class="product-actions"><button class="small-btn edit" onclick="openProduct('${safe(p.id)}')">✏️ تعديل</button><button class="small-btn delete" onclick="deleteProduct('${safe(p.id)}')">🗑️ حذف</button></div>`;box.appendChild(div)});if(!box.children.length)box.innerHTML='<div class="info-box" style="text-align:center">لا توجد منتجات.</div>'}
function renderHomeProducts(){const box=document.getElementById("homeProducts");box.innerHTML="";products.slice(0,5).forEach(p=>{const d=document.createElement("div");d.className="product";d.innerHTML=`<div class="product-main"><div class="product-info"><div class="product-icon">📦</div><div><div class="product-name">${safe(p.name)}</div><div class="product-ref">${safe(p.reference)}</div></div></div><div class="quantity">${Number(p.quantity||0)}<small>الكمية</small></div></div>`;box.appendChild(d)});if(!box.children.length)box.innerHTML='<div class="info-box" style="text-align:center">لا توجد منتجات بعد.</div>'}
function openProduct(id=null){document.getElementById("productId").value=id||"";if(id){const p=products.find(x=>x.id===id);if(!p)return;document.getElementById("productCode").value=p.reference||"";document.getElementById("productName").value=p.name||"";document.getElementById("productCategory").value=p.family||"";document.getElementById("productQty").value=p.quantity||0}else{document.getElementById("productCode").value="";document.getElementById("productName").value="";document.getElementById("productCategory").value="";document.getElementById("productQty").value=0}document.getElementById("productModal").classList.add("show")}
async function saveProduct(e){e.preventDefault();if(!currentUser)return toast("يجب تسجيل الدخول أولاً ❌");const id=document.getElementById("productId").value;const obj={user_id:currentUser.id,name:document.getElementById("productName").value.trim(),reference:document.getElementById("productCode").value.trim(),family:document.getElementById("productCategory").value.trim(),quantity:Number(document.getElementById("productQty").value)||0};if(!obj.name||!obj.reference)return toast("أدخل اسم السلعة والمرجع ❌");const r=id?await db.from("products").update(obj).eq("id",id).eq("user_id",currentUser.id):await db.from("products").insert(obj);if(r.error){console.error(r.error);return toast("تعذر إضافة السلعة: "+errText(r.error));}closeModal("productModal");await loadProducts();statistics();toast(id?"تم تعديل السلعة ✅":"تمت إضافة السلعة ✅")}

async function deleteProduct(id){if(!confirm("هل أنت متأكد من حذف المنتج؟"))return;const {error}=await db.from("products").delete().eq("id",id).eq("user_id",currentUser.id);if(error){toast("تعذر حذف المنتج: "+errText(error));return}await loadProducts();statistics();toast("تم حذف المنتج ✅")}
async function loadMovements(){const {data,error}=await db.from("movements").select("*").eq("user_id",currentUser.id).order("created_at",{ascending:false});if(error){console.error(error);return}movements=data||[];renderMovements()}
function renderMovements(){const box=document.getElementById("homeProducts");const q=(document.getElementById("movementSearch")?.value||"").toLowerCase();const list=movements.filter(m=>`${m.product_name||""} ${m.note||""} ${m.type||""}`.toLowerCase().includes(q));const sec=document.getElementById("reports");if(!document.getElementById("movementSearch"))return;if(!list.length)return;}
function openMovement(type){movementType=type;document.getElementById("movementTitle").textContent=type==="entry"?"📥 دخول المخزون":"📤 خروج المخزون";const s=document.getElementById("movementProduct");s.innerHTML="";products.forEach(p=>{const o=document.createElement("option");o.value=p.id;o.textContent=`${p.name} (${p.quantity})`;s.appendChild(o)});if(!products.length){toast("أضف منتجًا أولاً ❌");return}document.getElementById("movementQty").value=1;document.getElementById("movementNote").value="";document.getElementById("movementModal").classList.add("show")}
async function saveMovement(e){e.preventDefault();const pid=document.getElementById("movementProduct").value,qty=Number(document.getElementById("movementQty").value),note=document.getElementById("movementNote").value.trim(),p=products.find(x=>x.id===pid);if(!p||qty<=0)return;const newQty=movementType==="entry"?Number(p.quantity||0)+qty:Number(p.quantity||0)-qty;if(newQty<0){toast("الكمية غير كافية للخروج ❌");return}const a=await db.from("movements").insert({user_id:currentUser.id,product_id:pid,product_name:p.name,type:movementType,quantity:qty,note});if(a.error){toast("تعذر تسجيل الحركة: "+errText(a.error));return}const b=await db.from("products").update({quantity:newQty}).eq("id",pid).eq("user_id",currentUser.id);if(b.error){toast("تم تسجيل الحركة لكن تعذر تحديث الكمية: "+errText(b.error));return}closeModal("movementModal");await loadProducts();await loadMovements();statistics();toast("تم تسجيل الحركة ✅")}
async function loadWorkers(){const {data,error}=await db.from("workers").select("*").eq("user_id",currentUser.id).order("name");if(error){toast("خطأ في تحميل العمال ❌");console.error(error);return}workers=data||[];renderWorkers()}
function renderWorkers(){const box=document.getElementById("workersList"),q=(document.getElementById("workerSearch")?.value||"").toLowerCase().trim();box.innerHTML="";workers.filter(w=>(w.name||"").toLowerCase().includes(q)||(w.matricule||"").toLowerCase().includes(q)).forEach(w=>{const d=document.createElement("div");d.className="worker";d.innerHTML=`<div class="worker-main"><div class="worker-info"><div class="worker-icon">👷</div><div><div class="worker-name">${safe(w.name)}</div><div class="worker-matricule">${safe(w.matricule)}</div><div style="font-size:11px;color:#6b7280;margin-top:4px">${safe(w.job||"")}</div></div></div><span class="worker-status ${w.status==="inactive"?"inactive":""}">${w.status==="inactive"?"غير نشط":"نشط"}</span></div><div class="product-actions"><button class="small-btn delete" onclick="deleteWorker('${safe(w.id)}')">🗑️ حذف</button></div>`;box.appendChild(d)});if(!box.children.length)box.innerHTML='<div class="info-box" style="text-align:center">لا يوجد عمال.</div>'}
function openWorker(){document.getElementById("workerMatricule").value="";document.getElementById("workerName").value="";document.getElementById("workerRole").value="";document.getElementById("workerModal").classList.add("show")}
async function saveWorker(e){e.preventDefault();if(!currentUser)return toast("يجب تسجيل الدخول أولاً ❌");const matricule=document.getElementById("workerMatricule").value.trim();const name=document.getElementById("workerName").value.trim();const job=document.getElementById("workerRole").value.trim();if(!matricule||!name)return toast("أدخل Matricule واسم العامل ❌");if(workers.some(w=>String(w.matricule||"").trim().toLowerCase()===matricule.toLowerCase()))return toast("هذا الـ Matricule موجود بالفعل ❌");const obj={user_id:currentUser.id,matricule,name,job,status:"active"};const {error}=await db.from("workers").insert(obj);if(error){console.error(error);return toast("تعذر إضافة العامل: "+errText(error));}closeModal("workerModal");await loadWorkers();await loadEquipment();renderDue();toast("تمت إضافة العامل ✅")}

async function deleteWorker(id){const w=workers.find(x=>x.id===id);if(!w||!confirm("هل أنت متأكد من حذف العامل؟\n\n"+w.name))return;const {error}=await db.from("workers").delete().eq("id",id).eq("user_id",currentUser.id);if(error){toast("تعذر حذف العامل: "+errText(error));return}await loadWorkers();await loadEquipment();renderDue();statistics();toast("تم حذف العامل ✅")}
async function loadEquipment(){const {data,error}=await db.from("equipment").select("*").eq("user_id",currentUser.id);if(error){toast("خطأ في تحميل التجهيزات ❌");console.error(error);return}equipment=data||[];renderEquipment();renderDue()}
function interval(t){return t==="shoes"?{m:12,d:0}:t==="bleu"?{m:6,d:0}:t==="glasses"?{m:6,d:0}:t==="gants"?{m:0,d:35}:{m:6,d:0}}
function nextDue(date,type){const x=interval(type);return x.m?addMonths(date,x.m):addDays(date,x.d)}
function dueDiffDays(date){if(!date)return null;return Math.ceil((new Date(date+"T00:00:00")-new Date(todayKey()+"T00:00:00"))/86400000)}
function dueStatus(date){if(!date)return"none";const diff=dueDiffDays(date);return diff<=0?"due":diff<30?"soon":"notdue"}
function remainingText(date){
  if(!date)return "لم يُسلّم";
  const diff=dueDiffDays(date);
  if(diff<=0)return diff===0?"مستحق اليوم":"مستحق منذ "+Math.abs(diff)+" يوم";
  const a=new Date(todayKey()+"T00:00:00"), b=new Date(date+"T00:00:00");
  let months=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
  const anchor=new Date(a); anchor.setMonth(anchor.getMonth()+months);
  if(anchor>b){months--;anchor.setMonth(anchor.getMonth()-1)}
  const days=Math.round((b-anchor)/86400000);
  let parts=[];
  if(months===1)parts.push("شهر واحد");
  else if(months===2)parts.push("شهران");
  else if(months>2)parts.push(months+" أشهر");
  if(days===1)parts.push("يوم واحد");
  else if(days===2)parts.push("يومان");
  else if(days>2)parts.push(days+" أيام");
  return "باقي "+(parts.join(" و ")||diff+" يوم");
}
function equipmentLabel(t){return {shoes:"حذاء حماية",bleu:"ملابس العمل",glasses:"نظارات حماية",gants:"قفازات",vest_soudeur:"سترة لحام"}[t]||t}
function statusText(s){return s==="due"?"مستحق":s==="soon"?"قريب من الاستحقاق":s==="notdue"?"غير مستحق":"لم يُسلّم"}
function openEquipment(){const s=document.getElementById("equipmentWorker");s.innerHTML='<option value="">اختر العامل...</option>';workers.filter(w=>w.status!=="inactive").forEach(w=>{const o=document.createElement("option");o.value=w.matricule;o.textContent=`${w.name} (${w.matricule})`;s.appendChild(o)});document.getElementById("equipmentDate").value=todayKey();document.getElementById("equipmentQty").value=1;document.getElementById("equipmentBon").value="";document.getElementById("equipmentNote").value="";document.getElementById("equipmentModal").classList.add("show")}
async function saveEquipment(){const matricule=document.getElementById("equipmentWorker").value;const type=document.getElementById("equipmentType").value;const last=document.getElementById("equipmentDate").value;const qty=Math.max(1,Number(document.getElementById("equipmentQty").value)||1);if(!matricule||!last)return toast("اختر العامل وتاريخ التسليم ❌");const w=workers.find(x=>String(x.matricule)===String(matricule));if(!w)return toast("العامل غير موجود ❌");const names={shoes:"حذاء حماية",bleu:"بدلة عمل",glasses:"نظارات حماية",gants:"قفازات",vest_soudeur:"سترة لحام"};const obj={user_id:currentUser.id,created_by:currentUser.id,worker_id:w.id,matricule:w.matricule,worker_name:w.name||"",type,equipment_name:names[type]||type,quantity:qty,last_date:last,due_date:nextDue(last,type),bon:document.getElementById("equipmentBon").value.trim(),note:document.getElementById("equipmentNote").value.trim()};const existing=equipment.find(x=>String(x.worker_id)===String(w.id)&&String(x.type)===String(type));const r=existing?await db.from("equipment").update(obj).eq("id",existing.id).eq("user_id",currentUser.id):await db.from("equipment").insert(obj);if(r.error){console.error(r.error);return toast("تعذر تسجيل التجهيز: "+errText(r.error));}closeModal("equipmentModal");await loadEquipment();renderDue();statistics();toast("تم تسجيل التجهيز ✅")}

async function loadUsers(){
  if(!isMasterAdmin())return;
  const {data,error}=await db.from("profiles").select("id,full_name,role,created_at,is_blocked").order("full_name");
  if(error){console.error(error);toast("تعذر تحميل المستخدمين: "+errText(error));return}
  users=data||[];renderUsers();
}
function renderUsers(){
  const body=document.getElementById("usersList"),q=(document.getElementById("userSearch")?.value||"").toLowerCase();
  body.innerHTML="";
  users.filter(u=>`${u.full_name||""} ${u.id||""} ${u.role||""}`.toLowerCase().includes(q)).forEach(u=>{
    const admin=u.role==="admin",self=u.id===currentUser.id,blocked=!!u.is_blocked;
    const tr=document.createElement("tr");
    const roleText=admin?'<span class="admin-badge">ADMIN</span>':'<span>WORKER</span>';
    const state=blocked?'<span class="status status-notdue">موقوف</span>':'<span class="status status-due">نشط</span>';
    let actions='';
    if(self){actions='<span style="color:#6b7280;font-size:11px">حسابك</span>'}
    else if(false){actions='<span class="admin-badge">الأدمن الرئيسي</span>'}
    else{
      actions=`<div class="admin-actions">
        ${admin?`<button class="small-btn warning" onclick="setUserRole('${u.id}','worker')">👤 نزع الأدمن</button>`:`<button class="small-btn success" onclick="setUserRole('${u.id}','admin')">👑 تعيين أدمن</button>`}
        ${blocked?`<button class="small-btn success" onclick="setUserBlocked('${u.id}',false)">✅ تفعيل</button>`:`<button class="small-btn delete" onclick="setUserBlocked('${u.id}',true)">⏸️ توقيف</button>`}
      </div>`;
    }
    tr.className=blocked?'blocked':'';
    tr.innerHTML=`<td style="direction:ltr;text-align:left;font-size:10px">${safe(u.id||"-")}</td><td>${safe(u.full_name||"بدون اسم")}</td><td>${roleText}</td><td>${state}</td><td>${actions}</td>`;
    body.appendChild(tr);
  });
  if(!body.children.length)body.innerHTML='<tr><td colspan="5" style="text-align:center;padding:25px;color:#6b7280">لا توجد حسابات.</td></tr>';
}

async function adminProfileUpdate(id,values,successMessage){
  if(!isMasterAdmin()||id===currentUser.id)return;
  const {error}=await db.from("profiles").update(values).eq("id",id);
  if(error){console.error(error);toast("تعذر تنفيذ العملية: "+errText(error));return}
  await loadUsers();toast(successMessage);
}
async function setUserRole(id,role){
  if(!isMasterAdmin()||id===currentUser.id)return;
  if(!confirm(role==="admin"?"تعيين هذا المستخدم كأدمن؟":"نزع صلاحية الأدمن من هذا المستخدم؟"))return;
  await adminProfileUpdate(id,{role},role==="admin"?"تم تعيينه أدمن ✅":"تم نزع صلاحية الأدمن ✅");
}
async function setUserBlocked(id,blocked){
  if(!isMasterAdmin()||id===currentUser.id)return;
  if(!confirm(blocked?"توقيف هذا الحساب مؤقتًا؟":"إعادة تفعيل هذا الحساب؟"))return;
  await adminProfileUpdate(id,{is_blocked:blocked},blocked?"تم توقيف الحساب مؤقتًا ⏸️":"تم تفعيل الحساب ✅");
}

async function setUserRole(id,role){if(!isMasterAdmin()||id===currentUser.id)return;if(!confirm(role==="admin"?tr("makeAdmin"):tr("removeAdmin")))return;await adminProfileUpdate(id,{role},role==="admin"?tr("makeAdmin"):tr("removeAdmin"))}

async function setUserSuspended(id,suspended){if(!isMasterAdmin()||id===currentUser.id)return;if(!confirm(suspended?tr("suspend"):tr("unsuspend")))return;await adminProfileUpdate(id,{is_suspended:suspended},suspended?tr("suspendedStatus"):tr("activeStatus"))}
</script>
