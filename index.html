<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stock Pro - إدارة المخزن والتجهيزات</title>

<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="./manifest.json">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

:root{
--primary:#2563eb;
--primary-dark:#1d4ed8;
--secondary:#64748b;
--bg-dark:#0f172a;
--bg-card:#1e293b;
--bg-input:#334155;
--text-main:#f8fafc;
--text-muted:#94a3b8;
--border:#475569;
--danger:#ef4444;
--warning:#f59e0b;
--success:#10b981;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

html,body{
min-height:100%;
}

body{
background:var(--bg-dark);
color:var(--text-main);
direction:rtl;
}

button,
input,
select,
textarea{
font-family:inherit;
}

button{
cursor:pointer;
}

.hidden{
display:none!important;
}

/* ================= LOGIN ================= */

#loginScreen{
position:fixed;
inset:0;
background:var(--bg-dark);
display:flex;
align-items:center;
justify-content:center;
padding:1rem;
z-index:9999;
}

.login-card{
width:100%;
max-width:420px;
background:var(--bg-card);
border:1px solid var(--border);
border-radius:1rem;
padding:2rem;
box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.login-logo{
width:70px;
height:70px;
margin:0 auto 1rem;
border-radius:18px;
background:var(--primary);
display:flex;
align-items:center;
justify-content:center;
font-size:2rem;
}

.login-title{
text-align:center;
font-size:1.5rem;
font-weight:bold;
margin-bottom:.4rem;
}

.login-subtitle{
text-align:center;
color:var(--text-muted);
margin-bottom:1.5rem;
}

.login-group{
margin-bottom:1rem;
}

.login-group label{
display:block;
margin-bottom:.4rem;
}

.password-wrap{
position:relative;
}

.password-wrap input{
width:100%;
padding-left:3rem;
}

.password-toggle{
position:absolute;
left:.5rem;
top:50%;
transform:translateY(-50%);
background:none;
border:none;
color:var(--text-muted);
font-size:1.1rem;
padding:.4rem;
}

.login-btn{
width:100%;
justify-content:center;
padding:.8rem;
margin-top:.5rem;
}

.login-error{
display:none;
background:rgba(239,68,68,.15);
border:1px solid rgba(239,68,68,.4);
color:#fca5a5;
padding:.7rem;
border-radius:.5rem;
margin-bottom:1rem;
text-align:center;
}

/* ================= APP ================= */

#app{
display:none;
min-height:100vh;
}

header{
background:var(--bg-card);
padding:1rem 1.5rem;
display:flex;
justify-content:space-between;
align-items:center;
gap:1rem;
border-bottom:1px solid var(--border);
}

.brand{
display:flex;
align-items:center;
gap:.75rem;
font-size:1.25rem;
font-weight:bold;
color:var(--primary);
}

.user-panel{
display:flex;
align-items:center;
gap:.7rem;
}

#userEmail{
color:var(--text-muted);
font-size:.85rem;
max-width:240px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

nav{
background:#111827;
display:flex;
overflow-x:auto;
border-bottom:1px solid var(--border);
}

.nav-btn{
padding:.75rem 1.15rem;
background:none;
border:none;
color:var(--text-muted);
display:flex;
align-items:center;
gap:.5rem;
white-space:nowrap;
transition:.2s;
}

.nav-btn:hover,
.nav-btn.active{
color:var(--primary);
border-bottom:2px solid var(--primary);
background:rgba(37,99,235,.1);
}

main{
width:100%;
max-width:1200px;
margin:auto;
padding:1.5rem;
}

.view-section{
display:none;
}

.view-section.active{
display:block;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:1rem;
margin-bottom:1.5rem;
}

.stat-card{
background:var(--bg-card);
padding:1.25rem;
border-radius:.6rem;
border:1px solid var(--border);
}

.stat-card .title{
font-size:.875rem;
color:var(--text-muted);
}

.stat-card .value{
font-size:1.8rem;
font-weight:bold;
margin-top:.5rem;
}

.controls{
display:flex;
gap:.7rem;
margin-bottom:1rem;
flex-wrap:wrap;
}

input,
select,
textarea{
background:var(--bg-input);
border:1px solid var(--border);
color:var(--text-main);
padding:.65rem .8rem;
border-radius:.4rem;
outline:none;
width:100%;
}

.controls input{
flex:1;
min-width:180px;
}

input:focus,
select:focus,
textarea:focus{
border-color:var(--primary);
}

.btn{
background:var(--primary);
color:white;
border:none;
padding:.6rem 1rem;
border-radius:.4rem;
display:inline-flex;
align-items:center;
justify-content:center;
gap:.5rem;
font-weight:500;
}

.btn:hover{
background:var(--primary-dark);
}

.btn:disabled{
opacity:.6;
cursor:not-allowed;
}

.btn-danger{
background:var(--danger);
}

.btn-danger:hover{
background:#dc2626;
}

.btn-warning{
background:var(--warning);
color:#111827;
}

.btn-secondary{
background:var(--secondary);
}

.btn-success{
background:var(--success);
}

table{
width:100%;
border-collapse:collapse;
background:var(--bg-card);
border:1px solid var(--border);
border-radius:.5rem;
overflow:hidden;
}

th,
td{
padding:.75rem 1rem;
text-align:right;
border-bottom:1px solid var(--border);
}

th{
background:#0f172a;
color:var(--text-muted);
}

tr:last-child td{
border-bottom:none;
}

/* ================= MODAL ================= */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.72);
display:none;
justify-content:center;
align-items:center;
padding:1rem;
z-index:1000;
}

.modal.show{
display:flex;
}

.modal-content{
background:var(--bg-card);
padding:1.5rem;
border-radius:.7rem;
width:100%;
max-width:500px;
max-height:90vh;
overflow:auto;
border:1px solid var(--border);
}

.modal-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:1rem;
}

.modal-close{
background:none;
border:none;
color:var(--text-main);
font-size:1.6rem;
}

.form-group{
margin-bottom:1rem;
display:flex;
flex-direction:column;
gap:.35rem;
}

.form-actions{
display:flex;
gap:.5rem;
margin-top:1rem;
}

/* ================= STATUS ================= */

.status{
padding:.25rem .55rem;
border-radius:.3rem;
font-size:.75rem;
display:inline-block;
white-space:nowrap;
}

.status-due{
background:rgba(239,68,68,.2);
color:#fca5a5;
}

.status-soon{
background:rgba(245,158,11,.2);
color:#fde047;
}

.status-good{
background:rgba(16,185,129,.2);
color:#6ee7b7;
}

.status-none{
background:rgba(148,163,184,.2);
color:#cbd5e1;
}

/* ================= EQUIPMENT ================= */

.worker-card{
background:var(--bg-card);
border:1px solid var(--border);
border-radius:.6rem;
padding:1rem;
margin-bottom:1rem;
}

.worker-card-header{
margin-bottom:.6rem;
}

.worker-card-header h4{
color:var(--primary);
margin-bottom:.2rem;
}

.equipment-row{
display:flex;
justify-content:space-between;
align-items:center;
gap:1rem;
border-bottom:1px solid var(--border);
padding:.65rem 0;
}

.equipment-row:last-child{
border-bottom:none;
}

.equipment-info{
min-width:0;
}

.equipment-date{
font-size:.78rem;
color:var(--text-muted);
margin-top:.2rem;
}

.empty{
text-align:center;
padding:2rem;
color:var(--text-muted);
}

/* ================= TOAST ================= */

#toast{
position:fixed;
bottom:1rem;
left:1rem;
right:1rem;
max-width:420px;
margin:auto;
background:var(--bg-card);
border:1px solid var(--border);
padding:.8rem 1rem;
border-radius:.5rem;
display:none;
z-index:2000;
text-align:center;
}

#toast.show{
display:block;
}

/* ================= INSTALL ================= */

.install-box{
position:fixed;
bottom:1rem;
right:1rem;
z-index:1500;
}

@media(max-width:700px){

header{
padding:.8rem 1rem;
}

#userEmail{
display:none;
}

main{
padding:1rem;
}

th,
td{
padding:.6rem;
font-size:.82rem;
}

.btn{
padding:.55rem .75rem;
}

.equipment-row{
align-items:flex-start;
}

}

</style>
</head>

<body>

<!-- =====================================================
LOGIN
===================================================== -->

<div id="loginScreen">

<div class="login-card">

<div class="login-logo">
<i class="fa-solid fa-boxes-stacked"></i>
</div>

<div class="login-title">
Stock Pro
</div>

<div class="login-subtitle">
إدارة المخزن والتجهيزات

<div id="loginError" class="login-error"></div>

<div class="login-group">

<label for="loginEmail">
البريد الإلكتروني

<input
type="email"
id="loginEmail"
autocomplete="email"
placeholder="example@email.com"
required
>

<div class="login-group">

<label for="loginPassword">
كلمة السر

<i class="fa-solid fa-eye"></i>
</button>

</div>

</div>

<button
type="submit"
class="btn login-btn"
id="loginBtn"
>
<i class="fa-solid fa-right-to-bracket"></i>
دخول إلى التطبيق
</button>

</form>

</div>

</div>


<!-- =====================================================
APP
===================================================== -->

<div id="app">

<header>

<div class="brand">
<i class="fa-solid fa-boxes-stacked"></i>
Stock Pro
</div>

<div class="user-panel">

<span id="userEmail"></span>

<button
class="btn btn-secondary"
onclick="logout()"
title="تسجيل الخروج"
>
<i class="fa-solid fa-right-from-bracket"></i>
</button>

</div>

</header>


<nav>

<button
class="nav-btn active"
onclick="switchTab('stock')"
>
<i class="fa-solid fa-box"></i>
المخزون
</button>

<button
class="nav-btn"
onclick="switchTab('movements')"
>
<i class="fa-solid fa-right-left"></i>
الحركات
</button>

<button
class="nav-btn"
onclick="switchTab('workers')"
>
<i class="fa-solid fa-users"></i>
العمال

<button
class="nav-btn"
onclick="switchTab('equipment')"
>
<i class="fa-solid fa-shirt"></i>
التجهيزات
</button>

<button
class="nav-btn"
onclick="switchTab('due')"
>
<i class="fa-solid fa-clock-rotate-left"></i>
الاستحقاقات

<main>

<!-- =====================================================
STOCK
===================================================== -->

<section
id="stockView"
class="view-section active"
>

<div class="stats-grid">

<div class="stat-card">
<div class="title">إجمالي المنتجات</div>
<div class="value" id="productsNumber">0</div>
</div>

<div class="stat-card">
<div class="title">دخول اليوم</div>
<div class="value" id="entryToday">0</div>
</div>

<div class="stat-card">
<div class="title">خروج اليوم</div>
<div class="value" id="exitToday">0</div>
</div>

</div>


<div class="controls">

<input
type="text"
id="stockSearch"
placeholder="بحث عن منتج..."
>

<button
class="btn"
onclick="openProductModal()"
>
<i class="fa-solid fa-plus"></i>
منتج جديد
</button>

<button
class="btn btn-warning"
onclick="openMovementModal()"
>
<i class="fa-solid fa-right-left"></i>
تسجيل حركة
</button>

</div>


<table>

<thead>

<tr>
<th>الرمز</th>
<th>الاسم</th>
<th>الفئة</th>
<th>الكمية</th>
<th>إجراءات</th>
</tr>

</thead>

<tbody id="productsList"></tbody>

</table>

</section>


<!-- =====================================================
MOVEMENTS
===================================================== -->

<section
id="movementsView"
class="view-section"
>

<div class="controls">

<input
type="text"
id="movementSearch"
placeholder="بحث بالحركات..."
>

</div>

<table>

<thead>

<tr>
<th>التاريخ</th>
<th>النوع</th>
<th>المنتج</th>
<th>الكمية</th>
<th>الملاحظة</th>
</tr>

</thead>

<tbody id="movementsList"></tbody>

</table>

</section>


<!-- =====================================================
WORKERS
===================================================== -->

<section
id="workersView"
class="view-section"
>

<div class="controls">

<input
type="text"
id="workerSearch"
placeholder="بحث عن عامل..."
>

<button
class="btn"
onclick="openWorkerModal()"
>
<i class="fa-solid fa-user-plus"></i>
عامل جديد
</button>

</div>

<table>

<thead>

<tr>
<th>رقم التسجيل</th>
<th>الاسم</th>
<th>المهنة</th>
<th>الحالة</th>
<th>إجراءات</th>
</tr>

</thead>

<tbody id="workersList"></tbody>

</table>

</section>


<!-- =====================================================
EQUIPMENT
===================================================== -->

<section
id="equipmentView"
class="view-section"
>

<div class="controls">

<input
type="text"
id="equipmentSearch"
placeholder="بحث عن عامل..."
>

<button
class="btn"
onclick="openEquipment()"
>
<i class="fa-solid fa-hand-holding"></i>
تسليم تجهيز
</button>

</div>

<div id="equipmentList"></div>

</section>


<!-- =====================================================
DUE
===================================================== -->

<section
id="dueView"
class="view-section"
>

<div class="stats-grid">

<div class="stat-card">

<div class="title">
تجهيزات مستحقة اليوم أو سابقة
</div>

<div
class="value"
id="dueToday"
>
0
</div>

</div>

</div>


<div class="controls">

<input
type="text"
id="dueSearch"
placeholder="تصفية باسم العامل أو الرقم..."

<div id="dueList"></div>

</section>

</main>

</div>

===================================================== -->

>

<h3 id="productModalTitle">
منتج جديد

class="modal-close"
onclick="closeProductModal()"

&times;
</button>

الكمية

<button
class="btn"
type="submit"

حفظ

<button
type="button"
class="btn btn-secondary"

إلغاء

</div>

إلغاء

</form>

</div>

>

إلغاء

</form>

</div>

</div>

رقم وصل التسليم

ملاحظات

<input

>

إلغاء

</div>

</div>

</div>

/* =====================================================
UTILITIES
===================================================== */

function todayKey(){

const d=new Date();

const y=d.getFullYear();

const m=String(d.getMonth()+1).padStart(2,"0");

const day=String(d.getDate()).padStart(2,"0");

return `${y}-${m}-${day}`;

}


function formatDate(date){

if(!date) return "-";

const d=new Date(date+"T00:00:00");

if(Number.isNaN(d.getTime())) return "-";

return d.toLocaleDateString("ar-DZ");

}


function addMonths(dateStr,months){

const d=new Date(dateStr+"T00:00:00");

const originalDay=d.getDate();

d.setMonth(d.getMonth()+months);

if(d.getDate()!==originalDay){

d.setDate(0);

}

return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

}


function addDays(dateStr,days){

const d=new Date(dateStr+"T00:00:00");

d.setDate(d.getDate()+days);

return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

}


function safe(str){

if(str===null || str===undefined) return "";

return String(str)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function toast(message){

const el=document.getElementById("toast");

if(!el) return;

el.textContent=message;

el.classList.add("show");

clearTimeout(window.toastTimer);

window.toastTimer=setTimeout(()=>{

el.classList.remove("show");

},3000);

}

function switchTab(tabId){

document
.querySelectorAll(".nav-btn")
.forEach(btn=>btn.classList.remove("active"));

document
.querySelectorAll(".view-section")
.forEach(sec=>sec.classList.remove("active"));

const targetBtn=
document.querySelector(
`[onclick="switchTab('${tabId}')"]`
);

const targetSec=
document.getElementById(tabId+"View");

if(targetBtn)
targetBtn.classList.add("active");

if(targetSec)
targetSec.classList.add("active");

}

async function saveMovement(e){

e.preventDefault();

if(!currentUser){

toast("يجب تسجيل الدخول ❌");

return;

}

const pId=
document.getElementById("movementProduct").value;

const type=
document.getElementById("movementType").value;

const qty=
Number(document.getElementById("movementQty").value);

const note=
document.getElementById("movementNote").value.trim();

if(!pId || !qty || qty<1){

toast("أدخل بيانات الحركة بشكل صحيح ❌");

return;

}

const prod=
products.find(p=>p.id===pId);

if(!prod){

toast("المنتج غير موجود ❌");

return;

}

const currentQty=
Number(prod.quantity)||0;

if(type==="exit" && qty>currentQty){

toast(
`الكمية غير كافية. المتوفر: ${currentQty} ❌`
);

return;

}

const newQty=
type==="entry"
?currentQty+qty
:currentQty-qty;

try{

const movementResult=
await db
.from("movements")
.insert({

user_id:currentUser.id,
product_id:pId,
product_name:prod.name,
type:type,
quantity:qty,
note:note

});

if(movementResult.error){

console.error(movementResult.error);

toast("تعذر تسجيل الحركة ❌");

return;

}

const productResult=
await db
.from("products")
.update({
quantity:newQty
})
.eq("id",pId)
.eq("user_id",currentUser.id);

if(productResult.error){

console.error(productResult.error);

toast(
"تم تسجيل الحركة لكن تعذر تحديث الكمية ❌"
);

await loadAll();

return;

}

closeMovementModal();

await loadProducts();

await loadMovements();

statistics();

toast("تم تسجيل الحركة ✅");

}catch(error){

console.error(error);

toast("حدث خطأ أثناء تسجيل الحركة ❌");

}

}

function getEquipmentInterval(type){

switch(type){

case "shoes":
return {months:12,days:0};

case "bleu":
return {months:6,days:0};

case "glasses":
return {months:6,days:0};

case "gants":
return {months:0,days:35};

case "vest_soudeur":
return {months:6,days:0};

default:
return {months:6,days:0};

}

}


function calculateNextDueDate(lastDate,type){

if(!lastDate)
return null;

const interval=
getEquipmentInterval(type);

if(interval.months>0)
return addMonths(
lastDate,
interval.months
);

if(interval.days>0)
return addDays(
lastDate,
interval.days
);

return null;

}


function getDueStatus(nextDueDate){

if(!nextDueDate)
return "none";

const today=
new Date(todayKey()+"T00:00:00");

const due=
new Date(nextDueDate+"T00:00:00");

const diffTime=
due-today;

const diffDays=
Math.ceil(
diffTime/(1000*60*60*24)
);

if(diffDays<=0)
return "due";

if(diffDays<=30)
return "soon";

return "good";

}


function getStatusText(status){

switch(status){

case "due":
return "مستحق";

case "soon":
return "قريب الاستحقاق";

case "good":
return "ساري المفعول";

default:
return "لم يسلم";

}

}


function getStatusClass(status){

switch(status){

case "due":
return "status-due";

case "soon":
return "status-soon";

case "good":
return "status-good";

default:
return "status-none";

}

}

const search=
(document.getElementById("equipmentSearch")?.value || "")
.toLowerCase()
.trim();

const activeWorkers=
workers.filter(w=>{

if(w.status==="inactive")
return false;

const name=
String(w.name||"").toLowerCase();

const matricule=
String(w.matricule||"").toLowerCase();

return name.includes(search) ||
matricule.includes(search);

});

if(!activeWorkers.length){

box.innerHTML=`
<div class="empty">
لا يوجد عمال متطابقون
</div>`;

return;

}

box.innerHTML="";

const types=[
"shoes",
"bleu",
"glasses",
"gants",
"vest_soudeur"
];

activeWorkers.forEach(w=>{

const card=
document.createElement("div");

card.className="worker-card";

let itemsHtml="";

types.forEach(type=>{

const eq=
equipment.find(e=>
e.worker_matricule===w.matricule &&
e.equipment_type===type
);

const status=
eq
?getDueStatus(eq.next_due_date)
:"none";

itemsHtml+=`

<div class="equipment-row">

<div class="equipment-info">

<strong>
${t(type)}
</strong>

<div class="equipment-date">

آخر تسليم:
${formatDate(eq?.last_date)}

<br>

تاريخ الاستحقاق:
${formatDate(eq?.next_due_date)}

${eq?.quantity
?`<br>الكمية: ${safe(eq.quantity)}`
:""}

</div>

</div>

<span class="status ${getStatusClass(status)}">

${getStatusText(status)}

</span>

</div>

`;

});

card.innerHTML=`

<div class="worker-card-header">

<h4>
${safe(w.name)}
</h4>

<small>
Matricule:
${safe(w.matricule)}
</small>

</div>

${itemsHtml}

`;

box.appendChild(card);

});

}


/* =====================================================
DUE
===================================================== */

function renderDue(){

const box=
document.getElementById("dueList");

if(!box)
return;

const search=
(document.getElementById("dueSearch")?.value || "")
.toLowerCase()
.trim();

let dueCount=0;

box.innerHTML="";

const types=[
"shoes",
"bleu",
"glasses",
"gants",
"vest_soudeur"
];

workers
.filter(w=>
w.status==="active" || !w.status
)
.forEach(w=>{

const name=
String(w.name||"").toLowerCase();

const matricule=
String(w.matricule||"").toLowerCase();

if(
search &&
!name.includes(search) &&
!matricule.includes(search)
)
return;

const dueItems=[];

types.forEach(type=>{

const eq=
equipment.find(e=>
e.worker_matricule===w.matricule &&
e.equipment_type===type
);

const status=
eq
?getDueStatus(eq.next_due_date)
:"none";

if(
status==="due" ||
status==="soon" ||
status==="none"
){

if(status==="due")
dueCount++;

dueItems.push({
type:type,
eq:eq,
status:status
});

}

});

if(!dueItems.length)
return;

const card=
document.createElement("div");

card.className="worker-card";

let itemsHtml="";

dueItems.forEach(item=>{

itemsHtml+=`

<div class="equipment-row">

<div class="equipment-info">

<strong>
${t(item.type)}
</strong>

<div class="equipment-date">

الاستحقاق:
${formatDate(item.eq?.next_due_date)}

</div>

</div>

<span class="status ${getStatusClass(item.status)}">

${getStatusText(item.status)}

</span>

</div>

`;

});

card.innerHTML=`

<div class="worker-card-header">

<h4>
${safe(w.name)}
</h4>

<small>
Matricule:
${safe(w.matricule)}
</small>

</div>

${itemsHtml}

`;

box.appendChild(card);

});

document.getElementById("dueToday").textContent=
dueCount;

if(!box.children.length){

box.innerHTML=`
<div class="empty">
لا توجد استحقاقات حالية
</div>`;

}

}


/* =====================================================
STATISTICS
===================================================== */

function statistics(){

const productsNumber=
document.getElementById("productsNumber");

const entryToday=
document.getElementById("entryToday");

const exitToday=
document.getElementById("exitToday");

if(productsNumber)
productsNumber.textContent=
products.length;

const today=todayKey();

let entries=0;

let exits=0;

movements.forEach(m=>{

const date=
m.created_at
?m.created_at.substring(0,10)
:"";

if(date===today){

if(m.type==="entry")
entries+=Number(m.quantity)||0;

if(m.type==="exit")
exits+=Number(m.quantity)||0;

}

});

if(entryToday)
entryToday.textContent=entries;

if(exitToday)
exitToday.textContent=exits;

}

/* =====================================================
PWA INSTALL
===================================================== */

window.addEventListener(
"beforeinstallprompt",
function(e){

e.preventDefault();

deferredInstallPrompt=e;

if(!document.getElementById("installBtn")){

const box=
document.createElement("div");

box.className="install-box";

box.innerHTML=`

<button
id="installBtn"
class="btn"
>
<i class="fa-solid fa-download"></i>
تثبيت التطبيق
</button>

`;

document.body.appendChild(box);

document
.getElementById("installBtn")
.addEventListener(
"click",
async function(){

if(!deferredInstallPrompt)
return;

deferredInstallPrompt.prompt();

await deferredInstallPrompt.userChoice;

deferredInstallPrompt=null;

box.remove();

}
);

}

}
);

)
.catch(

)
);

}
);

}
